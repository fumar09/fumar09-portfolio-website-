    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        var portrait = document.createElement('link');
        portrait.rel = 'preload';
        portrait.as = 'image';
        portrait.fetchPriority = 'high';
        portrait.media = '(min-width: 1100px)';
        portrait.href = document.documentElement.dataset.theme === 'dark'
          ? '/images/profile-dark.jpg'
          : '/images/profile-light.jpg';
        document.head.appendChild(portrait);
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
